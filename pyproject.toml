[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custom-orm"
version = "0.1.0"
description = "A lightweight ORM for PostgreSQL and MySQL — v1"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Team" }]
dependencies = [
    "psycopg[binary]>=3.1",
    "PyMySQL>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "types-PyMySQL",
]

[project.scripts]
orm-migrate = "orm.migrations.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require Docker DB)",
]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
disable_error_code = ["no-any-return", "attr-defined", "arg-type"]
exclude = ["tests/"]

[tool.hatch.build.targets.wheel]
packages = ["orm"]
